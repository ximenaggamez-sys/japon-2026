<style>

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10131C; --surface:#181C28; --ink:#E9EBF3; --muted:#A1A8C1; --rule:#2A3043; --tint:#222839;

  }
}
:root[data-theme="dark"]{
  --paper:#10131C; --surface:#181C28; --ink:#E9EBF3; --muted:#A1A8C1; --rule:#2A3043; --tint:#222839;

*{box-sizing:border-box}

body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}

/* header */

.stamp i{font-style:normal;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.06em;display:block}
.brand-t{display:grid;line-height:1.15;min-width:0}
.brand-t b{font-family:var(--display);font-weight:800;font-size:19px}
.brand-t small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langsw{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--surface);flex:none}
.langsw button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font:700 12.5px/1 var(--body);color:var(--muted);cursor:pointer;min-width:38px;min-height:30px}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* route line */
.route{margin:16px 0 12px;font-size:13px;color:var(--muted);line-height:1.5}
.route b{color:var(--ink);font-weight:700}

/* days */
.days{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px}
.day{display:grid;grid-template-columns:50px minmax(0,1fr);gap:12px;padding:12px 14px 13px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--rule);scroll-margin-top:72px}
.day.trip{background:color-mix(in srgb,var(--low) 8%,var(--surface));border-color:color-mix(in srgb,var(--low) 32%,var(--rule))}
.day.today{box-shadow:0 0 0 2px var(--stamp);border-color:transparent}
.day.past{opacity:.62}
.dd{display:grid;align-content:start;justify-items:center;text-align:center;padding-top:1px}
.dd .wd{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dd .dn{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.05}
.dd .mo{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase}
.day h2{margin:0;font-size:16.5px;line-height:1.3;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 0}
.tg{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--muted)}
.tg.trip{background:var(--low);color:var(--paper)}
.tg.today{background:var(--stamp);color:var(--on-stamp)}
.areas{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0;padding:0;list-style:none}
.areas li{font-size:13.5px;font-weight:500;padding:3px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);line-height:1.4}
.mv{display:flex;gap:7px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45}
.mv svg{flex:none;width:15px;height:15px;margin-top:2px}
.wx{margin-top:9px;padding:8px 10px;border-radius:10px;background:var(--tint);font-size:13px;line-height:1.45;display:grid;gap:1px}
.wx .w2{color:var(--muted)}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{font-size:12px;color:var(--muted);padding:4px 0 28px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);z-index:30;width:max-content;max-width:min(92vw,460px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:14px;box-shadow:var(--shadow)}
.toast button{margin-left:10px;border:0;background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 10px;font-weight:700;cursor:pointer}

  try{
    const lat = zs.map(z => Z[z].c[0]).join(","), lng = zs.map(z => Z[z].c[1]).join(",");
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16`);
    if(!r.ok) throw 0;
    let j = await r.json(); if(!Array.isArray(j)) j = [j];
    const z = {}; zs.forEach((id, i) => { const d = j[i] && j[i].daily; if(d) z[id] = {t:d.time, hi:d.temperature_2m_max, lo:d.temperature_2m_min, p:d.precipitation_probability_max, c:d.weather_code}; });
    WX = {ts:Date.now(), z}; store.set("jp-wx", WX);
    render();
  }catch(e){}
  WX_BUSY = false;
}

/* ---------- render ---------- */
const TRAIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l-2-4M15 21l2-4M9 14h.01M15 14h.01"/></svg>';
function dayHTML(d, today){
  const dt = pd(d.d), L = LANG;
  const w = wxFor(d.d, d.z);
  const tags = [];
  if(d.d === today) tags.push(`<span class="tg today">${T2("Today","Hoy")}</span>`);
  if(d.trip) tags.push(`<span class="tg trip">Day trip</span>`);
  if(d.hol) tags.push(`<span class="tg">${T2("Holiday","Festivo")}</span>`);
  return `<li class="day${d.trip?" trip":""}${d.d===today?" today":""}${d.d<today?" past":""}" id="day-${d.d}">
    <div class="dd" aria-hidden="true"><span class="wd">${WD[L][dt.getDay()]}</span><span class="dn">${dt.getDate()}</span><span class="mo">${MO[L][dt.getMonth()]}</span></div>
    <div>
      <h2><span class="vh">${dt.getDate()} ${MO[L][dt.getMonth()]} · </span>${esc(d.t[L])}</h2>
      ${tags.length?`<div class="tags">${tags.join("")}</div>`:""}
      <ul class="areas" aria-label="${T2("Areas","Zonas")}">${d.a[L].map(a => `<li>${esc(a)}</li>`).join("")}</ul>
      <div class="mv">${TRAIN}<span>${esc(d.mv[L])}</span></div>
      ${w?`<div class="wx"><span>${w.ic} <b>${w.hi}° / ${w.lo}°</b>${w.p!=null?` · ☔ ${w.p}%`:""} · ${esc(w.txt)}</span><span class="w2">👕 ${esc(wear(w, d.z))}</span></div>`:""}
    </div></li>`;
}
function render(){
  const today = todayISO();
  document.documentElement.lang = LANG;
  document.title = T2("Japan 2026 · Day by day","Japón 2026 · Plan por día");
  document.querySelector(".brand-t b").textContent = T2("Japan 2026","Japón 2026");
  document.getElementById("sub").textContent = T2("Day by day · Nov 10 – Dec 4","Plan por día · 10 nov – 4 dic");
  document.getElementById("route").innerHTML = T2(
    "<b>Tokyo</b> → Hakone → <b>Kyoto</b> → <b>Osaka</b> → Kanazawa → <b>Takayama</b> → <b>Tokyo</b>",
    "<b>Tokio</b> → Hakone → <b>Kioto</b> → <b>Osaka</b> → Kanazawa → <b>Takayama</b> → <b>Tokio</b>");
  document.getElementById("days").innerHTML = DAYS.map(d => dayHTML(d, today)).join("");
  document.getElementById("foot").textContent = T2(
    "Weather: Open-Meteo forecast when you're online; otherwise the typical values for the date. Works offline once opened.",
    "Clima: pronóstico de Open-Meteo cuando hay conexión; si no, el promedio de la fecha. Funciona sin conexión una vez abierta.");
  document.querySelectorAll(".langsw [data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
}
document.querySelector(".langsw").addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if(!b || b.dataset.lang === LANG) return;
  LANG = b.dataset.lang; store.set("jp-lang", LANG); render();
});

render();
{ const el = document.getElementById("day-" + todayISO()); if(el) el.scrollIntoView({block:"start"}); }
wxFetch();
addEventListener("online", wxFetch);
document.addEventListener("visibilitychange", () => { if(!document.hidden) wxFetch(); });

/* ---------- offline ---------- */
function toast(msg, btn, fn){
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status");
  t.textContent = msg;
  if(btn){ const b = document.createElement("button"); b.type = "button"; b.textContent = btn; b.onclick = fn; t.appendChild(b); }
  document.body.appendChild(t); setTimeout(() => t.remove(), 8000);
}
{
  let framed = false; try{ framed = window.top !== window.self; }catch(e){ framed = true; }
  if("serviceWorker" in navigator && !framed && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").catch(() => {});
    navigator.serviceWorker.addEventListener("controllerchange", () => { if(had) toast(T2("The guide was updated.","La guía se actualizó."), T2("Reload","Recargar"), () => location.reload()); });
  }
}
